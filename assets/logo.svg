<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Flying Pie Pizzaria emblem">
  <defs>
    <path id="ring" d="M60 60 m-44 0 a44 44 0 1 1 88 0 a44 44 0 1 1 -88 0"/>
  </defs>
  <!-- badge base -->
  <circle cx="60" cy="60" r="58" fill="#1c1813"/>
  <circle cx="60" cy="60" r="55" fill="#fece00"/>
  <circle cx="60" cy="60" r="40" fill="#008144" stroke="#1c1813" stroke-width="2.5"/>
  <!-- ring text -->
  <g fill="#1c1813" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:8.4px;letter-spacing:1.6px">
    <text>
      <textPath href="#ring" startOffset="2%">FLYING&#160;PIE&#160;&#9733;&#160;PIZZARIA&#160;&#9733;&#160;EST&#160;1978&#160;&#9733;&#160;BOISE&#160;ID&#160;&#9733;</textPath>
    </text>
  </g>
  <!-- flying saucer pizza -->
  <g transform="translate(60 60)">
    <!-- beam -->
    <path d="M-15 16 L-26 34 L26 34 L15 16 Z" fill="#fece00" opacity="0.5"/>
    <!-- pizza dome -->
    <path d="M-22 4 A22 22 0 0 1 22 4 Z" fill="#e43d4c" stroke="#1c1813" stroke-width="2.4"/>
    <!-- crust rim -->
    <path d="M-24 4 Q0 18 24 4" fill="none" stroke="#f4e9d2" stroke-width="6" stroke-linecap="round"/>
    <path d="M-24 4 Q0 18 24 4" fill="none" stroke="#1c1813" stroke-width="2.4"/>
    <!-- pepperoni -->
    <circle cx="-10" cy="-3" r="3" fill="#c32533"/>
    <circle cx="6" cy="-6" r="3" fill="#c32533"/>
    <circle cx="-2" cy="2" r="2.4" fill="#c32533"/>
    <circle cx="13" cy="0" r="2.4" fill="#c32533"/>
    <!-- little wings -->
    <path d="M-22 2 q-12 -3 -16 4 q10 1 16 0" fill="#0056a7" stroke="#1c1813" stroke-width="1.8"/>
    <path d="M22 2 q12 -3 16 4 q-10 1 -16 0" fill="#0056a7" stroke="#1c1813" stroke-width="1.8"/>
  </g>
</svg>
